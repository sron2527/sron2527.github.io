name: Build LikhitThai Windows Client

on:
  workflow_dispatch:
  push:
    paths:
      - "likhitthai-client/**"
      - ".github/workflows/build-likhitthai-client.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: likhitthai-client/desktop/package.json
      - name: Install dependencies
        working-directory: likhitthai-client/desktop
        run: npm install
      - name: Build Windows x64 installer and portable app
        working-directory: likhitthai-client/desktop
        run: npm run dist
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: LikhitThai-Windows-x64-1.0.3
          path: |
            likhitthai-client/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
